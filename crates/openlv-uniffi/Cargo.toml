[package]
name = "openlv-uniffi"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
name = "openlv_ffi"
crate-type = ["rlib", "cdylib", "staticlib"]

[dependencies]
openlv = { path = "../openlv" }
uniffi = { version = "=0.32.2", features = ["scaffolding-ffi-buffer-fns"] }
parking_lot = "0.12"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "time", "sync", "macros"] }
